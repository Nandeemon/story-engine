<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Story Engine</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Courier+Prime:wght@400;700&family=Figtree:wght@400;500;600&family=Lora:wght@400;600&display=swap">
  </head>
  <body>
    <div class="wrap">
      <header class="bar">
        <button class="brand" data-act="home" title="Your stories">Story Engine <small>prototype</small></button>
        <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>
        <div class="tools" id="tools"></div>
      </header>
      <div class="savewarn" id="savewarn" role="alert" hidden>This browser has stopped saving your story, because its storage is full. Save to file to keep your work. <button class="btn small" data-act="save-file">Save to file</button></div>
      <main id="main"></main>
      <input type="file" id="file" accept="image/*" hidden>
      <input type="file" id="projectfile" accept=".json,application/json" hidden>
      <input type="file" id="lookfile" accept="image/*" multiple hidden>
      <input type="file" id="soundfile" accept="audio/*" hidden>
      <input type="file" id="charfile" accept="image/*" hidden>
      <div class="toast" id="toast" role="status" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
